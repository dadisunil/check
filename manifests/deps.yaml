# "DBs/dependencies run inside k8s" - lab stand-ins for RDS, Mongo Atlas, Confluent Kafka.
# Official images only (no Bitnami, per Uniphore policy). Lab passwords only!
apiVersion: v1
kind: Secret
metadata: { name: lab-creds, namespace: deps }
stringData:
  POSTGRES_PASSWORD: labpass
  MONGO_INITDB_ROOT_USERNAME: root
  MONGO_INITDB_ROOT_PASSWORD: labpass
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: deps }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom: [{ secretRef: { name: lab-creds } }]
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data, subPath: pg }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: deps }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongo, namespace: deps }
spec:
  serviceName: mongo
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          envFrom: [{ secretRef: { name: lab-creds } }]
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: mongo, namespace: deps }
spec: { selector: { app: mongo }, ports: [{ port: 27017 }] }
---
# Redpanda = Kafka-API-compatible, single binary (stand-in for Confluent Kafka)
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: deps }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
          args: [redpanda, start, --smp=1, --memory=512M, --overprovisioned, --node-id=0,
                 "--kafka-addr=0.0.0.0:9092", "--advertise-kafka-addr=kafka.deps.svc.cluster.local:9092"]
          ports: [{ containerPort: 9092 }]
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: deps }
spec: { selector: { app: kafka }, ports: [{ port: 9092 }] }
