# Argo Rollouts gives in-cluster progressive delivery. Default = canary; staging overrides to blue/green.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: hello }
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: hello } }
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
  template:
    metadata: { labels: { app: hello } }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: hello-world-go   # rewritten by each overlay's `images:` block
          env: [{ name: LAB_ENV, value: base }]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 } }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata: { name: hello }
spec:
  selector: { app: hello }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: hello-preview }
spec:
  selector: { app: hello }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: hello }
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app: hello } }
---
# Default-deny ingress except from same namespace (enforced only with a CNI that supports it, e.g. Calico/Cilium)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: {} }] }]
