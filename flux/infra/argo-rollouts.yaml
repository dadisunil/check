apiVersion: v1
kind: Namespace
metadata: { name: argo-rollouts }
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: { name: argo, namespace: argo-rollouts }
spec:
  interval: 1h
  url: https://argoproj.github.io/argo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: argo-rollouts, namespace: argo-rollouts }
spec:
  interval: 10m
  chart:
    spec:
      chart: argo-rollouts
      version: 2.37.x
      sourceRef: { kind: HelmRepository, name: argo }
  values:
    dashboard: { enabled: true }
