name: ci
# Build -> lint -> scan -> push -> sign -> auto-deploy to STAGING (continuous delivery).
# Prod promotion is a separate, approval-gated workflow (promote.yml).
on:
  push:
    branches: [main]
    paths: ['apps/**']
  pull_request:
    paths: ['apps/**', 'flux/**']

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hello-world-go

permissions:
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # cosign keyless signing
      security-events: write   # upload SARIF
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # --- Shift-left checks ---
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: apps/hello-world-go/Dockerfile }
      - name: Helm lint
        run: helm lint apps/hello-world-go/chart
      - name: IaC / manifest misconfiguration scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scanners: secret, scan-ref: ., exit-code: '1' }

      # --- Build once, scan before push ---
      - uses: docker/setup-buildx-action@v3
      - name: Build (local only)
        uses: docker/build-push-action@v7
        with:
          context: apps/hello-world-go
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # --- Only reached if scans passed; never on PRs ---
      - name: Login to registry (ghcr stands in for Harbor)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: apps/hello-world-go
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
      - name: Sign image (cosign keyless)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3.7.0
      - if: github.event_name == 'push'
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

  deploy-staging:
    # GitOps: CI never touches the cluster, it only commits the new tag. Flux does the rollout.
    if: github.event_name == 'push'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Bump staging image tag
        env: { TAG: '${{ needs.build-scan-push.outputs.tag }}' }
        run: |
          yq -i '.images[0].newTag = strenv(TAG)' flux/apps/hello/staging/kustomization.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(staging): hello-world-go ${TAG}"
          git pull --rebase && git push
